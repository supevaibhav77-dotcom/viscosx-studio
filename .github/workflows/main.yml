name: Build viscosX Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check Java
        run: java -version

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source

      
      - name: Find Android project
        run: |
          echo "========== EXTRACTED FILES =========="
          find source -maxdepth 5 -type f | head -150

          echo "========== SEARCHING GRADLE FILES =========="
          find source -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" \
          \) -print

          SETTINGS=$(find source -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle settings file found."
            echo "The ZIP may not contain the complete Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "SUCCESS: Found Android project at $PROJECT_DIR"
          
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "APK file not found"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: viscosX-Studio-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
          
