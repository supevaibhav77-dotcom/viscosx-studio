
name: Build viscosX Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: java -version

      # 3. Install Gradle 8.9
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      # 4. Extract Android project ZIP
      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' \
            ! -name 'gradle-8.9-bin.zip' \
            ! -name 'gradle-*.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found!"
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          echo "Found Android project: $ZIP"

          mkdir -p source
          unzip -q "$ZIP" -d source

          echo "Android project extracted successfully"

      # 5. Find Android project
      - name: Find Android project
        run: |
          SETTINGS=$(find source -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found!"
            find source -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found Android project: $PROJECT_DIR"

      # 6. FIX JAVA AND KOTLIN JVM TARGET
      - name: Apply Java and Kotlin JVM 17 Fix
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle.kts"

          if not gradle_file.is_file():
              raise SystemExit(
                  f"ERROR: App Gradle file not found: {gradle_file}"
              )

          content = gradle_file.read_text()

          match = re.search(r'(?m)^[ \t]*android[ \t]*\{', content)

          if not match:
              raise SystemExit("ERROR: android { } block not found!")

          opening = content.find("{", match.start())
          depth = 0
          closing = None

          for index in range(opening, len(content)):
              if content[index] == "{":
                  depth += 1
              elif content[index] == "}":
                  depth -= 1

                  if depth == 0:
                      closing = index
                      break

          if closing is None:
              raise SystemExit("ERROR: Android block is incomplete!")

          fix = """
              // Automatic Java and Kotlin JVM 17 compatibility fix
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          content = content[:closing] + fix + "\n" + content[closing:]

          gradle_file.write_text(content)

          print("SUCCESS: Java source compatibility = 17")
          print("SUCCESS: Java target compatibility = 17")
          print("SUCCESS: Kotlin JVM target = 17")
          print(f"Updated: {gradle_file}")
          PY

      # 7. Build Android debug APK
      - name: Build debug APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      # 8. Locate generated APK
      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK generated successfully: $APK"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: viscosX-Studio-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
          
